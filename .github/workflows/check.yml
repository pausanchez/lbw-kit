name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check (version, build, tests)
        run: npm run check
        env:
          LBW_DENYLIST: ${{ secrets.LBW_DENYLIST }}
      - name: dist/ is up to date
        run: git diff --exit-code -- dist
